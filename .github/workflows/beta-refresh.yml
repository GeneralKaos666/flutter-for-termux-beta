name: beta-refresh

# Tracks latest Flutter beta pre-release tag (e.g. 3.49.0-0.2.pre):
# probes upstream tags once daily (11:00 UTC), refreshes build.toml
# pins when a new .pre tag appears, and pushes so the
# workflow_run-triggered build.yml run (gated) packages it
# (12:00 UTC scheduled run kept as fallback).
# Refresh only — it never builds and never pushes tags (see build.yml).
# Patch conflicts fail closed here (no pin push) and again in build.yml
# (no tag/release). No main-tracking logic here (beta-refresh.yml deleted).

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Probe latest upstream .pre tag
        id: probe
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags https://github.com/flutter/flutter.git \
            | grep -E 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+-.*\.pre$' \
            | sed 's|.*refs/tags/||' \
            | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "empty .pre tag list from upstream" >&2
            exit 1
          fi
          SHA=$(git ls-remote --tags https://github.com/flutter/flutter.git "refs/tags/${TAG}" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "could not resolve SHA for tag $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream latest .pre tag: $TAG ($SHA)"

      - name: Compare with pinned tag
        id: check
        run: |
          python3 - "${{ steps.probe.outputs.TAG }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          import tomllib
          latest = sys.argv[1]
          with open("build.toml", "rb") as f:
              current = tomllib.load(f)["flutter"].get("tag", "")
          if latest == current:
              print("should_refresh=false")
              print(f"already at latest .pre tag ({latest}), nothing to do.", file=sys.stderr)
          else:
              print("should_refresh=true")
              print(f"new .pre tag: {current} -> {latest}", file=sys.stderr)
          PY

      - name: Probe release metadata from a shallow tag checkout
        id: meta
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/flutter-probe
          git clone --depth 1 --branch "${{ steps.probe.outputs.TAG }}" \
            https://github.com/flutter/flutter.git /tmp/flutter-probe
          cd /tmp/flutter-probe
          CLONE_HEAD=$(git rev-parse HEAD)
          if [ "$CLONE_HEAD" != "${{ steps.probe.outputs.SHA }}" ]; then
            echo "clone raced upstream ($CLONE_HEAD != ${{ steps.probe.outputs.SHA }}); rerun later." >&2
            exit 1
          fi
          git config --global --add safe.directory /tmp/flutter-probe
          # Warm up once (downloads SDK/builds tool; progress goes to stdout
          # and would corrupt --machine JSON on first run), then capture.
          /tmp/flutter-probe/bin/flutter --version > /dev/null
          /tmp/flutter-probe/bin/flutter --version --machine > /tmp/flutter-version.json
          python3 - /tmp/flutter-version.json "${{ steps.probe.outputs.TAG }}" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              m = json.load(f)
          expected_tag = sys.argv[2]
          rev = m.get("frameworkRevision", "")
          date = m.get("frameworkCommitDate", "")
          dart = m.get("dartSdkVersion", "")
          devtools = m.get("devToolsVersion", "")
          fwver = m.get("frameworkVersion", "")
          for name, value in (("frameworkRevision", rev), ("frameworkCommitDate", date),
                              ("dartSdkVersion", dart), ("devToolsVersion", devtools),
                              ("frameworkVersion", fwver)):
              if not value:
                  raise SystemExit(f"flutter --version --machine missing {name}; full JSON:\n{json.dumps(m, indent=2)[:2000]}")
          if not re.fullmatch(r"[0-9a-f]{40}", rev):
              raise SystemExit(f"unexpected frameworkRevision: {rev!r}")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [+-]\d{4}", date):
              raise SystemExit(f"unexpected frameworkCommitDate format: {date!r}")
          if fwver == "0.0.0-unknown":
              raise SystemExit(f"flutter --version --machine returned unknown frameworkVersion; full JSON:\n{json.dumps(m, indent=2)[:2000]}")
          if not re.fullmatch(r"\d+\.\d+\.\d+-\d+\.\d+\.pre", fwver):
              raise SystemExit(f"unexpected frameworkVersion format for beta pre tag: {fwver!r}")
          if fwver != expected_tag:
              raise SystemExit(f"frameworkVersion {fwver!r} != probed tag {expected_tag!r}")
          print(f"NEW_REV={rev}")
          print(f"NEW_DATE={date}")
          print(f"NEW_DART={dart}")
          print(f"NEW_DEVTOOLS={devtools}")
          print(f"NEW_FWVER={fwver}")
          PY

      - name: Validate patches against probed tag (fail closed)
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          # Pinned-REV rebase evidence: on patch conflict stop here (no pin
          # bump, no push, and therefore no downstream build/tag). Reuses the
          # /tmp/flutter-probe checkout (already verified at probed tag) and
          # records patches/last-rebase.txt, committed with the pin bump below.
          python3 scripts/ci/verify_patches.py --rev "${{ steps.probe.outputs.SHA }}" --checkout /tmp/flutter-probe
          cat patches/last-rebase.txt

      - name: Bump build.toml pins
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          import os
          p = Path("build.toml")
          text = p.read_text(encoding="utf-8")
          for field, value in (
              ("tag", "${{ steps.probe.outputs.TAG }}"),
              ("dart_version", "${{ steps.meta.outputs.NEW_DART }}"),
              ("framework_version", "${{ steps.meta.outputs.NEW_FWVER }}"),
              ("framework_revision", "${{ steps.meta.outputs.NEW_REV }}"),
              ("framework_commit_date", "${{ steps.meta.outputs.NEW_DATE }}"),
              ("devtools_version", "${{ steps.meta.outputs.NEW_DEVTOOLS }}"),
          ):
              text, n = re.subn(rf"(?m)^{field} = '[^']*'", f"{field} = '{value}'", text)
              if n != 1:
                  raise SystemExit(f"expected 1 {field} line in build.toml, rewrote {n}")
          p.write_text(text, encoding="utf-8")
          PY
          git diff -- build.toml

      - name: Sync version references and verify
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          python3 scripts/ci/generate_versions.py
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          with open("build.toml", "rb") as f:
              flutter = tomllib.load(f)["flutter"]
          tag = str(flutter.get("tag", ""))
          if tag == "main":
              channel = "main"
          elif tag == "beta" or tag.endswith(".pre"):
              channel = "beta"
          else:
              channel = "stable"
          values = {
              "CANONICAL_FLUTTER_VER": tag,
              "CANONICAL_FRAMEWORK_REV": str(flutter.get("framework_revision", "")),
              "CANONICAL_FRAMEWORK_DATE": str(flutter.get("framework_commit_date", "")),
              "CANONICAL_DART_VER": str(flutter.get("dart_version", "")),
              "CANONICAL_DEVTOOLS_VER": str(flutter.get("devtools_version", "")),
              "CANONICAL_CHANNEL": channel,
          }
          p = Path("scripts/install/post_install.sh")
          text = p.read_text(encoding="utf-8")
          for key, value in values.items():
              text, n = re.subn(
                  rf'(?m)^({re.escape(key)}=")[^"]*(")',
                  lambda m, v=value: f"{m.group(1)}{v}{m.group(2)}",
                  text,
              )
              if n != 1:
                  raise SystemExit(f"expected 1 {key} line in post_install.sh, rewrote {n}")
          p.write_text(text, encoding="utf-8")
          d = Path("scripts/install/flutter_termux_doctor.sh")
          text = d.read_text(encoding="utf-8")
          for key, value in (
              ("EXP_VER", tag),
              ("EXP_CHANNEL", channel),
              ("EXP_REV", values["CANONICAL_FRAMEWORK_REV"]),
              ("EXP_DART", values["CANONICAL_DART_VER"]),
          ):
              text, n = re.subn(
                  rf'(?m)^({re.escape(key)}=")[^"]*(")',
                  lambda m, v=value: f"{m.group(1)}{v}{m.group(2)}",
                  text,
              )
              if n != 1:
                  raise SystemExit(f"expected 1 {key} line in flutter_termux_doctor.sh, rewrote {n}")
          d.write_text(text, encoding="utf-8")
          PY
          python3 scripts/ci/check_version_drift.py --fix
          python3 scripts/ci/check_repo.py
          git diff --stat
          git diff --check

      - name: Commit and push refresh
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "pins already current after sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(beta): refresh pins to flutter/${{ steps.probe.outputs.TAG }}"
          # Branch push only (never --tags, never --force): on a push race
          # (non-fast-forward) this fails with no pin push, and the gated
          # build.yml run then skips (pins-stale) so no new tag is pushed
          # until the conflict is resolved.
          git push
